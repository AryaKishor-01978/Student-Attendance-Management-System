<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Location Verification</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            margin-top: 0;
            color: #111827;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
        }

        .radius {
            margin: 20px 0;

            padding: 14px;

            background: #eff6ff;

            color: #1e40af;

            border-radius: 10px;

            font-weight: bold;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #111827;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;

            padding: 14px;

            border-radius: 10px;

            background: #f3f4f6;

            color: #374151;

            font-weight: 600;
        }

    </style>

</head>


<body>


    <div class="card">


        <div class="icon">
            📍
        </div>


        <h1>
            Verify Your Location
        </h1>


        <p>
            Attendance can only be marked when
            you are within the teacher's allowed
            attendance area.
        </p>


        <div class="radius">

            📏 Allowed Radius:
            {{ radius|round|int }} meters

        </div>


        <button
            id="locationButton"
            onclick="getStudentLocation()"
        >
            📍 Allow Location & Mark Attendance
        </button>


        <div id="status">
            Waiting for location permission...
        </div>


    </div>


    <script>

        function getStudentLocation() {

            const button =
                document.getElementById(
                    "locationButton"
                );

            const status =
                document.getElementById(
                    "status"
                );


            if (!navigator.geolocation) {

                status.innerText =
                    "❌ Geolocation is not supported by your browser.";

                return;
            }


            button.disabled = true;

            button.innerText =
                "📍 Getting your location...";


            status.innerText =
                "Please allow location access when your browser asks.";


            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;


                    status.innerText =
                        "✅ Location received. Checking attendance area...";


                    /*
                     * Create POST form
                     */

                    const form =
                        document.createElement("form");

                    form.method = "POST";

                    form.action =
                        "/qr-attendance/{{ token }}";


                    /*
                     * Latitude
                     */

                    const latitudeInput =
                        document.createElement("input");

                    latitudeInput.type = "hidden";

                    latitudeInput.name =
                        "latitude";

                    latitudeInput.value =
                        latitude;


                    /*
                     * Longitude
                     */

                    const longitudeInput =
                        document.createElement("input");

                    longitudeInput.type = "hidden";

                    longitudeInput.name =
                        "longitude";

                    longitudeInput.value =
                        longitude;


                    form.appendChild(
                        latitudeInput
                    );

                    form.appendChild(
                        longitudeInput
                    );


                    document.body.appendChild(
                        form
                    );


                    form.submit();

                },


                function(error) {

                    button.disabled = false;

                    button.innerText =
                        "📍 Allow Location & Mark Attendance";


                    if (error.code === 1) {

                        status.innerText =
                            "❌ Location permission denied. Please allow location access in your browser settings.";

                    }

                    else if (error.code === 2) {

                        status.innerText =
                            "❌ Unable to determine your location. Please check your GPS/location services.";

                    }

                    else if (error.code === 3) {

                        status.innerText =
                            "❌ Location request timed out. Please try again.";

                    }

                    else {

                        status.innerText =
                            "❌ Unable to get your location.";

                    }

                },


                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }

            );

        }

    </script>


</body>

</html>
