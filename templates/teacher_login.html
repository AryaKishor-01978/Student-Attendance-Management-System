<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3f8;
        }

        .header {
            background: #1f4e79;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .login-box {
            width: 350px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #1f4e79;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #163a5c;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1f4e79;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Student Attendance Management System</h1>
        <p>Teacher Portal</p>
    </div>

    <div class="login-box">

        <h2>Teacher Login</h2>

        <p class="subtitle">Login to manage student attendance</p>

        <form method="POST">

            <label>Username</label>
            <input type="text" name="username" placeholder="Enter your username" required>
        
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
        
            <button type="submit">Login</button>
        
        </form>

        <a href="/" class="back">← Back to Home</a>

    </div>

</body>
</html>
