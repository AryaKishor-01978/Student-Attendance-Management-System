<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Attendance Management System</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3f8;
        }

        .header {
            background: #1f4e79;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 500px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .container h2 {
            color: #1f4e79;
        }

        .container p {
            color: #666;
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 14px;
            background: #1f4e79;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 17px;
        }

        .btn:hover {
            background: #163a5c;
        }

        .footer {
            text-align: center;
            color: #777;
            margin-top: 40px;
        }

    </style>

</head>

<body>

    <div class="header">

        <h1>Student Attendance Management System</h1>

        <p>Manage and track student attendance easily</p>

    </div>


    <div class="container">

        <h2>Welcome</h2>

        <p>Please select your login portal</p>


        <a href="/teacher-login" class="btn">
            Teacher Login
        </a>


        <a href="/student-login" class="btn">
            Student Login
        </a>

    </div>


    <div class="footer">

        <p>© 2026 Student Attendance Management System</p>

    </div>

</body>

</html>
