<style>

    /* =====================================================
       CHATBOT BUTTON
    ===================================================== */

    #chatbot-button {
        position: fixed;
        right: 25px;
        bottom: 25px;

        width: 62px;
        height: 62px;

        border: none;
        border-radius: 50%;

        background: #2563eb;
        color: white;

        font-size: 28px;

        cursor: pointer;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.25);

        z-index: 99999;

        transition: 0.3s;
    }


    #chatbot-button:hover {
        transform: scale(1.08);
    }


    /* =====================================================
       CHATBOT WINDOW
    ===================================================== */

    #chatbot-window {

        display: none;

        position: fixed;

        right: 25px;
        bottom: 100px;

        width: 360px;
        height: 520px;

        background: white;

        border-radius: 18px;

        overflow: hidden;

        box-shadow:
            0 15px 40px rgba(0, 0, 0, 0.25);

        z-index: 99999;

        flex-direction: column;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .chatbot-header {

        background: #2563eb;

        color: white;

        padding: 17px;

        display: flex;

        justify-content: space-between;

        align-items: center;
    }


    .chatbot-header h3 {

        margin: 0;

        font-size: 17px;
    }


    .chatbot-status {

        margin-top: 4px;

        font-size: 12px;

        opacity: 0.9;
    }


    .chatbot-close {

        border: none;

        background: transparent;

        color: white;

        font-size: 22px;

        cursor: pointer;
    }


    /* =====================================================
       MESSAGE AREA
    ===================================================== */

    #chatbot-messages {

        flex: 1;

        overflow-y: auto;

        padding: 15px;

        background: #f8fafc;
    }


    .chat-message {

        display: flex;

        margin-bottom: 12px;
    }


    .chat-message.bot {

        justify-content: flex-start;
    }


    .chat-message.user {

        justify-content: flex-end;
    }


    .message-bubble {

        max-width: 82%;

        padding: 11px 14px;

        border-radius: 14px;

        font-size: 14px;

        line-height: 1.5;

        white-space: pre-line;
    }


    .bot .message-bubble {

        background: #e2e8f0;

        color: #1e293b;

        border-bottom-left-radius: 4px;
    }


    .user .message-bubble {

        background: #2563eb;

        color: white;

        border-bottom-right-radius: 4px;
    }


    /* =====================================================
       QUICK BUTTONS
    ===================================================== */

    .quick-buttons {

        display: flex;

        gap: 6px;

        padding: 8px;

        overflow-x: auto;

        background: white;

        border-top: 1px solid #e2e8f0;
    }


    .quick-buttons button {

        border: 1px solid #2563eb;

        background: white;

        color: #2563eb;

        padding: 7px 11px;

        border-radius: 20px;

        cursor: pointer;

        white-space: nowrap;

        font-size: 12px;
    }


    .quick-buttons button:hover {

        background: #2563eb;

        color: white;
    }


    /* =====================================================
       INPUT AREA
    ===================================================== */

    .chatbot-input-area {

        display: flex;

        padding: 10px;

        background: white;

        border-top: 1px solid #e2e8f0;
    }


    #chatbot-input {

        flex: 1;

        border: 1px solid #cbd5e1;

        border-radius: 10px;

        padding: 11px;

        outline: none;

        font-size: 14px;
    }


    #chatbot-send {

        width: 45px;

        margin-left: 7px;

        border: none;

        border-radius: 10px;

        background: #2563eb;

        color: white;

        font-size: 18px;

        cursor: pointer;
    }


    #chatbot-send:hover {

        background: #1d4ed8;
    }


    /* =====================================================
       TYPING
    ===================================================== */

    .typing {

        color: #64748b;

        font-size: 13px;

        padding: 5px;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 500px) {

        #chatbot-window {

            right: 10px;

            bottom: 85px;

            width: calc(100% - 20px);

            height: 480px;
        }


        #chatbot-button {

            right: 15px;

            bottom: 15px;
        }
    }

</style>


<!-- =====================================================
     CHATBOT BUTTON
===================================================== -->

<button
    id="chatbot-button"
    onclick="toggleChatbot()">

    💬

</button>


<!-- =====================================================
     CHATBOT WINDOW
===================================================== -->

<div id="chatbot-window">


    <!-- HEADER -->

    <div class="chatbot-header">

        <div>

            <h3>
                🤖 24/7 Student Support
            </h3>

            <div class="chatbot-status">

                🟢 Online • Always available

            </div>

        </div>


        <button
            class="chatbot-close"
            onclick="toggleChatbot()">

            ✕

        </button>

    </div>


    <!-- MESSAGES -->

    <div id="chatbot-messages">

        <div class="chat-message bot">

            <div class="message-bubble">

                👋 Hello!

                Welcome to the Student Attendance
                Management System.

                I am your 24/7 support assistant.

                How can I help you?

            </div>

        </div>

    </div>


    <!-- QUICK QUESTIONS -->

    <div class="quick-buttons">

        <button
            onclick="sendQuickMessage('How do I login?')">

            🔐 Login

        </button>


        <button
            onclick="sendQuickMessage('How do I mark attendance?')">

            📅 Attendance

        </button>


        <button
            onclick="sendQuickMessage('How can I check my attendance?')">

            📊 My Attendance

        </button>


        <button
            onclick="sendQuickMessage('Help')">

            🆘 Help

        </button>

    </div>


    <!-- INPUT -->

    <div class="chatbot-input-area">

        <input
            type="text"
            id="chatbot-input"
            placeholder="Type your question..."
            onkeydown="handleChatEnter(event)"
        >


        <button
            id="chatbot-send"
            onclick="sendChatMessage()">

            ➤

        </button>

    </div>

</div>


<script>

    // =====================================================
    // OPEN / CLOSE CHATBOT
    // =====================================================

    function toggleChatbot() {

        const chatbot =
            document.getElementById(
                "chatbot-window"
            );


        if (chatbot.style.display === "flex") {

            chatbot.style.display = "none";

        }

        else {

            chatbot.style.display = "flex";

            document.getElementById(
                "chatbot-input"
            ).focus();
        }
    }


    // =====================================================
    // ENTER KEY
    // =====================================================

    function handleChatEnter(event) {

        if (event.key === "Enter") {

            sendChatMessage();

        }
    }


    // =====================================================
    // QUICK MESSAGE
    // =====================================================

    function sendQuickMessage(message) {

        document.getElementById(
            "chatbot-input"
        ).value = message;

        sendChatMessage();
    }


    // =====================================================
    // ADD MESSAGE
    // =====================================================

    function addChatMessage(
        message,
        type
    ) {

        const messages =
            document.getElementById(
                "chatbot-messages"
            );


        const container =
            document.createElement("div");


        container.className =
            "chat-message " + type;


        const bubble =
            document.createElement("div");


        bubble.className =
            "message-bubble";


        bubble.textContent =
            message;


        container.appendChild(
            bubble
        );


        messages.appendChild(
            container
        );


        messages.scrollTop =
            messages.scrollHeight;
    }


    // =====================================================
    // TYPING INDICATOR
    // =====================================================

    function showTyping() {

        const messages =
            document.getElementById(
                "chatbot-messages"
            );


        const typing =
            document.createElement("div");


        typing.id =
            "typing-indicator";


        typing.className =
            "typing";


        typing.textContent =
            "🤖 Bot is typing...";


        messages.appendChild(
            typing
        );


        messages.scrollTop =
            messages.scrollHeight;
    }


    // =====================================================
    // REMOVE TYPING
    // =====================================================

    function removeTyping() {

        const typing =
            document.getElementById(
                "typing-indicator"
            );


        if (typing) {

            typing.remove();

        }
    }


    // =====================================================
    // SEND CHAT MESSAGE
    // =====================================================

    async function sendChatMessage() {

        const input =
            document.getElementById(
                "chatbot-input"
            );


        const message =
            input.value.trim();


        if (!message) {

            return;

        }


        // Show user message
        addChatMessage(
            message,
            "user"
        );


        // Clear input
        input.value = "";


        // Show typing
        showTyping();


        try {

            const response =
                await fetch(
                    "/chatbot",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Server error"
                );
            }


            const data =
                await response.json();


            setTimeout(
                function () {

                    removeTyping();

                    addChatMessage(
                        data.reply,
                        "bot"
                    );

                },
                500
            );


        }

        catch (error) {

            removeTyping();

            addChatMessage(
                "❌ Sorry, something went wrong. Please try again.",
                "bot"
            );

            console.error(error);
        }

    }

</script>
