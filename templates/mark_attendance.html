<!DOCTYPE html>

<html>
<head>
    <title>Mark Attendance</title>

```
<style>

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 85%;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    /* DATE SECTION */

    .date-box {
        text-align: center;
        margin-bottom: 25px;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 8px;
    }

    .date-box label {
        font-weight: bold;
        margin-right: 10px;
    }

    .date-box input {
        padding: 9px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 15px;
    }

    .load-btn {
        padding: 9px 18px;
        margin-left: 8px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .load-btn:hover {
        background: #0056b3;
    }

    /* TABLE */

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 12px;
        border: 1px solid #ddd;
        text-align: center;
    }

    th {
        background: #333;
        color: white;
    }

    select {
        padding: 8px;
        border-radius: 5px;
        cursor: pointer;
    }

    /* SAVE BUTTON */

    .save-btn {
        display: block;
        margin: 25px auto 10px;
        padding: 12px 30px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    .save-btn:hover {
        background: #218838;
    }

    /* BACK BUTTON */

    .back {
        display: block;
        text-align: center;
        margin-top: 20px;
        text-decoration: none;
        color: #007bff;
    }

    .back:hover {
        text-decoration: underline;
    }

    /* RESPONSIVE */

    @media (max-width: 700px) {

        .container {
            width: 95%;
            padding: 15px;
        }

        table {
            font-size: 13px;
        }

        th,
        td {
            padding: 8px;
        }

        .date-box input {
            width: 180px;
        }

    }

</style>
```

</head>

<body>

<div class="container">

```
<h1>📝 Mark Attendance</h1>


<!-- =========================
     SELECT DATE
     ========================= -->

<div class="date-box">

    <form method="GET" action="/mark-attendance">

        <label>
            📅 Attendance Date:
        </label>

        <input
            type="date"
            name="date"
            value="{{ selected_date }}"
            required
        >

        <button type="submit" class="load-btn">
            Load Attendance
        </button>

    </form>

</div>


<!-- =========================
     ATTENDANCE FORM
     ========================= -->

<form method="POST" action="/mark-attendance">

    <!-- Send selected date to Flask -->

    <input
        type="hidden"
        name="attendance_date"
        value="{{ selected_date }}"
    >


    <table>

        <tr>
            <th>Roll No</th>
            <th>Student Name</th>
            <th>Attendance</th>
        </tr>


        {% for student in students %}

        <tr>

            <!-- ROLL NUMBER -->

            <td>
                {{ student[4] }}
            </td>


            <!-- STUDENT NAME -->

            <td>
                {{ student[3] }}
            </td>


            <!-- ATTENDANCE -->

            <td>

                <select name="status_{{ student[0] }}">

                    {% if student[5] == "Present" %}

                        <option value="Present" selected>
                            Present
                        </option>

                        <option value="Absent">
                            Absent
                        </option>


                    {% elif student[5] == "Absent" %}

                        <option value="Present">
                            Present
                        </option>

                        <option value="Absent" selected>
                            Absent
                        </option>


                    {% else %}

                        <option value="Present" selected>
                            Present
                        </option>

                        <option value="Absent">
                            Absent
                        </option>

                    {% endif %}

                </select>

            </td>

        </tr>

        {% endfor %}

    </table>


    <!-- SAVE -->

    <button type="submit" class="save-btn">
        💾 Save Attendance
    </button>

</form>


<!-- BACK -->

<a href="/teacher-dashboard" class="back">
    ← Back to Dashboard
</a>
```

</div>

</body>
</html>
